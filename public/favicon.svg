<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Square Background -->
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#grad1)" />
  
  <!-- White Document Base -->
  <rect x="72" y="56" width="112" height="144" rx="16" fill="white" opacity="0.95" />
  
  <!-- Camera Lens Outer Ring -->
  <circle cx="128" cy="144" r="36" fill="url(#grad2)" />
  <!-- Camera Lens Middle Ring -->
  <circle cx="128" cy="144" r="16" fill="white" />
  <!-- Camera Lens Center -->
  <circle cx="128" cy="144" r="8" fill="#4f46e5" />
  <!-- Camera Lens Highlight -->
  <circle cx="134" cy="138" r="4" fill="white" opacity="0.8" />
  
  <!-- Document Text Lines -->
  <rect x="92" y="80" width="56" height="8" rx="4" fill="#cbd5e1" />
  <rect x="92" y="100" width="40" height="8" rx="4" fill="#cbd5e1" />
</svg>